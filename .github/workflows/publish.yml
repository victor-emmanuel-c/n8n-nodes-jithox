name: Publish to npm (provenance, no token)

# Publiek repo: standaard GitHub-runners zijn gratis. Geen NPM_TOKEN nodig:
# npm Trusted Publishing (OIDC) na de eerste handmatige publicatie.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npx -y npm@latest publish --provenance --access public
